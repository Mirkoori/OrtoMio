name: Aggiorna archivio luoghi

on:
  schedule:
    - cron: "17 3 5 * *"   # il 5 di ogni mese
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dati
  cancel-in-progress: false

jobs:
  luoghi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && pip install --quiet shapely

      - name: Scarica OpenStreetMap Italia
        run: |
          # Prova più copie dello stesso file: se una è lenta (meno di ~1 MB/s per 30 s) passa alla successiva.
          for url in \
            https://ftp5.gwdg.de/pub/misc/openstreetmap/download.geofabrik.de/italy-latest.osm.pbf \
            https://download.openstreetmap.fr/extracts/europe/italy-latest.osm.pbf \
            https://download.geofabrik.de/europe/italy-latest.osm.pbf; do
            echo "Provo $url"
            if curl -fL --retry 2 --connect-timeout 20 --speed-time 30 --speed-limit 1000000 --max-time 1500 -o italia.osm.pbf "$url"; then
              ls -lh italia.osm.pbf; ok=1; break
            fi
            rm -f italia.osm.pbf
          done
          test "$ok" = 1

      - name: Estrai i luoghi
        run: |
          osmium tags-filter italia.osm.pbf nwr/shop=farm nwr/shop=greengrocer nwr/amenity=marketplace -o luoghi.osm.pbf
          osmium export luoghi.osm.pbf -f geojsonseq --geometry-types=point,polygon --add-unique-id=type_id -o luoghi.geojsonseq
          ls -lh luoghi.osm.pbf luoghi.geojsonseq

      - name: Estrai i confini di regioni, province e comuni
        run: |
          osmium tags-filter italia.osm.pbf r/boundary=administrative -o conf0.osm.pbf
          osmium tags-filter conf0.osm.pbf r/admin_level=4,6,8 -o conf.osm.pbf
          osmium export conf.osm.pbf -f geojsonseq --geometry-types=polygon -o confini.geojsonseq
          ls -lh conf.osm.pbf confini.geojsonseq

      - name: Costruisci l'archivio compatto
        run: |
          python3 scripts/build_luoghi.py luoghi.geojsonseq confini.geojsonseq public/data/luoghi.json public/data/luoghi-meta.json
          ls -lh public/data
          cat public/data/luoghi-meta.json

      - name: Salva nel repository e ricostruisci l'app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Nessuna novità"; exit 0; fi
          git commit -m "Aggiorna archivio luoghi $(date +%F)"
          git pull --rebase
          git push
          gh workflow run pages.yml
          gh workflow run android.yml
