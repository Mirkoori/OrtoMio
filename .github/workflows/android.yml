name: Crea APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Compila l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          # il download di Gradle da GitHub può dare errori temporanei (504): fino a 3 tentativi
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon && exit 0; echo "Tentativo $i fallito"; sleep 20; done
          exit 1

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OrtoMio.apk

      - name: Pubblica l'APK come download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima-build
          name: Ultima build (APK di prova)
          prerelease: true
          make_latest: false
          files: OrtoMio.apk
          body: |
            APK di prova di Orto Mio, aggiornato a ogni modifica.
            Scarica `OrtoMio.apk` dal telefono e aprilo per installare o aggiornare l'app.
