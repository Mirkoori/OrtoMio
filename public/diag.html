<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova server mappe</title>
<style>body{font:15px/1.4 system-ui,sans-serif;margin:16px;background:#fff;color:#111}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left;vertical-align:top;word-break:break-all}
.ok{color:#0a7a2f;font-weight:700}.ko{color:#b00020}</style></head><body>
<h1>Prova server mappe</h1><p id="s">Provo… (fino a 20 secondi)</p>
<table id="t"><tr><th>Servizio</th><th>Esito</th><th>ms</th></tr></table>
<script>
var Q='[out:json][timeout:20];(nwr["shop"="farm"](around:6000,44.69,10.9);nwr["shop"="greengrocer"](around:6000,44.69,10.9););out center 50;';
var OV=["https://overpass-api.de/api/interpreter","https://lz4.overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter","https://overpass.openstreetmap.ru/api/interpreter","https://overpass.osm.ch/api/interpreter"];
var tests=[];
OV.forEach(function(u){tests.push({n:"POST "+u.split("/")[2],f:function(s){return fetch(u,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(Q),signal:s}).then(R)}})});
OV.slice(0,3).forEach(function(u){tests.push({n:"GET "+u.split("/")[2],f:function(s){return fetch(u+"?data="+encodeURIComponent(Q),{signal:s}).then(R)}})});
tests.push({n:"Nominatim azienda agricola",f:function(s){return fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&q="+encodeURIComponent("azienda agricola")+"&viewbox=10.75,44.80,11.05,44.58&bounded=1&limit=20",{signal:s}).then(R)}});
tests.push({n:"Photon azienda agricola",f:function(s){return fetch("https://photon.komoot.io/api/?q="+encodeURIComponent("azienda agricola")+"&lat=44.69&lon=10.9&limit=20",{signal:s}).then(R)}});
tests.push({n:"Photon osm_tag shop:farm",f:function(s){return fetch("https://photon.komoot.io/api/?q=farm&lat=44.69&lon=10.9&osm_tag=shop:farm&limit=20",{signal:s}).then(R)}});
function R(r){var t0=this;return r.text().then(function(x){var n="";try{var j=JSON.parse(x);n=j.elements?j.elements.length+" elementi":Array.isArray(j)?j.length+" risultati":j.features?j.features.length+" risultati":"json"}catch(e){n=x.slice(0,60).replace(/</g,"&lt;")}return {st:r.status,txt:n}})}
var left=tests.length,tb=document.getElementById("t");
tests.forEach(function(t){var row=tb.insertRow(),c1=row.insertCell(),c2=row.insertCell(),c3=row.insertCell();c1.textContent=t.n;c2.textContent="…";var t0=Date.now(),ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},20000);
t.f(ctl.signal).then(function(r){c2.innerHTML="HTTP "+r.st+": "+r.txt;c2.className=r.st==200?"ok":"ko"}).catch(function(e){c2.textContent="Errore: "+(e&&e.name==="AbortError"?"nessuna risposta in 20 s":e&&e.message);c2.className="ko"}).then(function(){clearTimeout(to);c3.textContent=Date.now()-t0;if(--left==0)document.getElementById("s").textContent="Fatto. Mandami uno screenshot."})});
</script></body></html>
